name: release

# Build the MSI on every version tag and attach it to the GitHub release.
# This is the other half of the skeleton's self-update: the app downloads the
# .msi from the latest release, so a release must actually carry one.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build.rs stamps the version from git describe

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Build MSI
        run: cargo wix --nocapture

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem target/wix/*.msi | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          } | Set-Content target/wix/SHA256SUMS.txt
          Get-Content target/wix/SHA256SUMS.txt

      - name: Attach MSI to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/wix/*.msi
            target/wix/SHA256SUMS.txt
